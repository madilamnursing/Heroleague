<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero League Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800;900&display=swap">
<style>/*
VOICE: loud, friendly comic-book narrator — short, punchy, never mean.
IDEA: a comic book where every screen is a page of inked panels.
PICTURE: the kid's own hero and each arena's scene, drawn large in the top panel.
COLOUR and TYPE: hero yellow ground with halftone, ink black outlines, red action, blue support; Bangers titles, Nunito text.
LAYOUT: one column of tilted panels; arena scene above the challenge; stacks on phones.
*/
:root{color-scheme:light;--ink:#16141a;--paper:#fffdf6;--yel:#ffd23f;--red:#e63946;--blue:#1d6fe0;--sky:#2ec4f1;--grn:#1fa35c;--org:#ff8a1f;--mut:#5a5566;--bg:#ffd23f;--panel:#fffdf6;--shadow:6px 6px 0 var(--ink);--r:14px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg) radial-gradient(circle,rgba(230,57,70,.18) 1.6px,transparent 1.8px) 0 0/14px 14px;color:var(--ink);font:17px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
h1,h2,h3,.comic{font-family:"Bangers","Impact","Arial Black",system-ui,sans-serif;letter-spacing:.04em;font-weight:400;line-height:1.05;margin:0}
h1{font-size:clamp(36px,6vw,58px)}h2{font-size:clamp(28px,4vw,40px)}h3{font-size:24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:1100px;margin:0 auto;padding:12px max(2.5vw,10px) 40px}
/* top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:4px 14px 2px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-1.5deg);font-size:26px;text-shadow:2px 2px 0 var(--ink);text-decoration:none;cursor:pointer}
.logo span{color:var(--yel)}
.topbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.chip b{color:var(--red)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border:4px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:17px;transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.yel{background:var(--yel)}.btn.grn{background:var(--grn);color:#fff}
.btn.big{font-family:"Bangers","Impact",sans-serif;font-size:28px;letter-spacing:.05em;padding:10px 26px;font-weight:400}
.btn.sm{min-height:44px;padding:6px 12px;font-size:15px;box-shadow:3px 3px 0 var(--ink);border-width:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.on{background:var(--ink);color:var(--yel)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
/* panels */
.panel{background:var(--panel);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(14px,2.5vw,24px);margin-bottom:18px;position:relative}
.panel.tilt{transform:rotate(-.6deg)}.panel.tilt2{transform:rotate(.5deg)}
.caption{position:absolute;top:-16px;left:16px;background:var(--yel);border:3px solid var(--ink);padding:2px 12px;font-family:"Bangers",Impact,sans-serif;font-size:19px;letter-spacing:.05em;transform:rotate(-2deg)}
.muted{color:var(--mut)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
@media(max-width:720px){.grid2{grid-template-columns:minmax(0,1fr)}}
/* title */
.title-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
@media(max-width:720px){.title-hero{grid-template-columns:minmax(0,1fr)}}
.burst{display:inline-block;background:var(--red);color:#fff;padding:6px 16px;border:4px solid var(--ink);transform:rotate(-3deg);text-shadow:3px 3px 0 var(--ink);box-shadow:var(--shadow)}
.burst2{display:inline-block;background:var(--blue);color:#fff;padding:4px 14px;border:4px solid var(--ink);transform:rotate(2deg);margin-top:-6px;text-shadow:2px 2px 0 var(--ink)}
.herobox{display:flex;justify-content:center;align-items:flex-end;background:linear-gradient(#2ec4f1,#9fe7ff);border:4px solid var(--ink);border-radius:var(--r);min-height:300px;position:relative;overflow:hidden}
.herobox svg{width:min(250px,70%);height:auto;position:relative;z-index:1}
.herobox::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.25) 0 8deg,transparent 8deg 20deg)}
/* creator */
.opt-label{font-weight:900;margin:12px 0 6px;display:block}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:50%;border:4px solid var(--ink);padding:0}
.sw[aria-pressed=true]{outline:4px solid var(--blue);outline-offset:2px;transform:scale(1.08)}
.choice{min-height:44px;padding:6px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:800;display:inline-flex;align-items:center;gap:6px}
.choice[aria-pressed=true]{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
.choice[disabled]{opacity:.45}
.choice svg{width:24px;height:24px}
.txt{width:100%;min-height:48px;font-size:20px;border:4px solid var(--ink);border-radius:10px;padding:6px 12px;background:#fff;font-weight:800}
/* hub */
.seg{display:inline-flex;border:4px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.seg button{border:0;border-right:3px solid var(--ink);background:var(--paper);min-height:46px;padding:6px 14px;font-weight:900}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--yel)}
.arena-card{display:flex;flex-direction:column;background:var(--panel);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:transform .12s}
.arena-card:hover{transform:rotate(-1deg) translateY(-3px)}
.arena-card .art{height:130px;border-bottom:4px solid var(--ink);position:relative;overflow:hidden}
.arena-card .art svg{width:100%;height:100%;display:block}
.arena-card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.arena-card p{margin:0;font-size:15px}
.arena-card .btn{margin-top:auto}
/* banners */
.banner{height:16px;border:3px solid var(--ink);border-radius:6px;margin:8px 0}
.banner.none{display:none}
.banner.bolt{background:repeating-linear-gradient(120deg,var(--yel) 0 16px,var(--ink) 16px 22px,var(--red) 22px 38px,var(--ink) 38px 44px)}
.banner.stars{background:#1b1f4a radial-gradient(circle,#fff 1.5px,transparent 2px) 0 0/18px 12px}
.banner.checker{background:conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/16px 16px}
.banner.galaxy{background:linear-gradient(90deg,#ff5fa2,#6a5cff,#2ec4f1,#1fa35c,#ffd23f)}
/* round */
.roundbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:22px;height:22px;border:3px solid var(--ink);border-radius:50%;background:#fff}
.pip.ok{background:var(--grn)}.pip.half{background:var(--yel)}.pip.miss{background:#bbb}.pip.now{background:var(--blue);box-shadow:0 0 0 3px var(--yel)}
.stage{position:relative;height:clamp(220px,34vw,320px);border:4px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;background:#1b1f4a}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%}
.stage .hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:5;pointer-events:none}
.stage .hud>*{pointer-events:auto}
.meter{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 8px;font-weight:900;font-size:14px;min-width:150px}
.meter .bar{height:12px;border:2px solid var(--ink);border-radius:6px;background:#eee;overflow:hidden;margin-top:2px}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--org),var(--red));transition:width .5s}
.board{display:flex;gap:6px;align-items:stretch;background:var(--ink);color:#fff;border:3px solid #000;border-radius:10px;padding:4px 8px;font-family:"Courier New",monospace;font-weight:900}
.board .sc{background:#000;color:#ffe34d;padding:0 8px;border-radius:6px;font-size:24px;min-width:52px;text-align:center}
.board .lb{font-size:11px;text-align:center;font-family:Nunito,system-ui,sans-serif}
.hero-sprite{position:absolute;bottom:6%;width:clamp(80px,13vw,120px);transition:left .7s ease,bottom .7s ease,transform .3s;z-index:3}
.hero-sprite svg,.rival-sprite svg{width:100%;height:auto;display:block}
.rival-sprite{position:absolute;bottom:6%;width:clamp(86px,14vw,130px);z-index:2;transition:transform .3s}
.bubble{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 10px;font-weight:900;font-size:15px;z-index:6;white-space:nowrap}
.challenge h3{margin-bottom:6px}
.prompt{font-size:clamp(20px,2.6vw,26px);font-weight:900;margin:6px 0 12px}
.sentence{font-size:20px;background:#fff7d1;border:3px dashed var(--ink);border-radius:10px;padding:8px 12px;margin:8px 0}
.clue{font-weight:800;color:var(--blue)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:60px}
.tile{width:52px;height:56px;border:4px solid var(--ink);border-radius:10px;background:var(--yel);font-family:"Bangers",Impact,sans-serif;font-size:30px;display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);text-transform:uppercase}
.tile.slot{background:#fff;border-style:dashed;box-shadow:none}
.tile.filled{background:var(--sky);border-style:solid}
.tile.used{visibility:hidden}
.tile.given{background:#e9e4d6;box-shadow:none}
.lin{width:52px;height:56px;border:4px solid var(--ink);border-radius:10px;background:#fff;font-family:"Bangers",Impact,sans-serif;font-size:30px;text-align:center;text-transform:uppercase;padding:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0}
.choices .btn{font-size:22px;min-height:60px}
.choices .btn.wrong{background:#ccc;text-decoration:line-through}
.choices .btn.right{background:var(--grn);color:#fff}
.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.answer-row .txt{max-width:260px}
.fb{border:4px solid var(--ink);border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:800;background:#fff}
.fb.good{background:#d8f8e4}.fb.bad{background:#ffe6d5}.fb.info{background:#e3efff}
.fb ol,.fb ul{margin:6px 0 0;padding-left:22px}
.fb h4{margin:0 0 4px;font-size:20px;font-family:"Bangers",Impact,sans-serif;letter-spacing:.05em;font-weight:400}
.offer{background:var(--yel);border:4px solid var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
.timerbar{height:12px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:6px 0 10px}
.timerbar i{display:block;height:100%;background:var(--grn);transition:width 1s linear}
/* hints */
.hintbox{border:3px solid var(--ink);border-radius:12px;background:#f0f7ff;padding:10px 12px;margin-top:10px}
.dots{display:inline-grid;gap:4px;margin:6px 0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.grp{display:inline-flex;flex-wrap:wrap;gap:3px;border:3px solid var(--ink);border-radius:12px;padding:6px;margin:4px;max-width:120px;background:#fff}
.grp.take{background:#fff3b0}
.fbar{display:flex;border:3px solid var(--ink);border-radius:6px;overflow:hidden;height:30px;margin:6px 0;max-width:420px}
.fbar i{flex:1;border-right:2px solid var(--ink);background:#fff}
.fbar i:last-child{border-right:0}
.fbar i.f{background:var(--org)}
.area{display:flex;max-width:420px;border:3px solid var(--ink);margin:6px 0}
.area div{padding:12px 6px;text-align:center;font-weight:900;border-right:3px solid var(--ink);background:#fff3b0}
.area div:last-child{border-right:0;background:#d6ecff}
.place{font-family:"Courier New",monospace;font-size:22px;font-weight:900;line-height:1.25;text-align:right;display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:8px;padding:6px 14px}
/* soccer aim */
.aim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:420px;margin:10px 0}
.aim .btn{min-height:56px}
/* word search */
.ws{display:grid;gap:4px;margin:10px 0;max-width:460px}
.ws button{aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;background:#fff;font-family:"Bangers",Impact,sans-serif;font-size:clamp(18px,3.2vw,26px);padding:0;min-height:36px}
.ws button.sel{background:var(--sky)}
.ws button.found{background:var(--grn);color:#fff}
.ws button.flash{background:var(--yel)}
.wslist{display:flex;flex-wrap:wrap;gap:8px}
.wslist span{border:3px solid var(--ink);border-radius:8px;padding:2px 10px;font-weight:900;background:#fff}
.wslist span.done{background:var(--grn);color:#fff;text-decoration:line-through}
/* wordle */
.wd{display:grid;gap:6px;justify-content:center;margin:10px 0}
.wd .wr{display:grid;grid-template-columns:repeat(5,clamp(46px,11vw,58px));gap:6px}
.wd .wc{aspect-ratio:1;border:4px solid var(--ink);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Bangers",Impact,sans-serif;font-size:clamp(22px,5vw,30px);line-height:1;text-transform:uppercase;position:relative}
.wc small{font-family:Nunito,system-ui,sans-serif;font-size:12px;font-weight:900;position:absolute;bottom:1px;right:4px}
.wc.correct,.key.correct{background:var(--grn);color:#fff}
.wc.present,.key.present{background:var(--org);color:var(--ink)}
.wc.absent,.key.absent{background:#8d8a94;color:#fff}
.kb{display:grid;gap:6px;margin-top:8px}
.kb .kr{display:flex;gap:5px;justify-content:center}
.key{min-width:0;flex:1;max-width:46px;min-height:52px;border:3px solid var(--ink);border-radius:8px;background:#fff;font-weight:900;padding:0;font-size:17px}
.key.wide{max-width:84px;flex:1.6;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:14px;font-weight:800}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-flex;width:24px;height:24px;border:2px solid var(--ink);border-radius:5px;align-items:center;justify-content:center;font-style:normal;font-size:13px}
/* progress */
.skillrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed #c9c3b5}
.skillrow:last-child{border-bottom:0}
.acc{height:18px;border:3px solid var(--ink);border-radius:9px;background:#eee;overflow:hidden}
.acc i{display:block;height:100%;background:var(--grn)}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:13px;font-weight:900;background:#fff;white-space:nowrap}
.tag.m{background:var(--yel)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge{border:3px solid var(--ink);border-radius:12px;padding:10px;text-align:center;background:#fff;font-size:14px}
.badge.locked{opacity:.4;filter:grayscale(1)}
.badge svg{width:54px;height:54px;display:block;margin:0 auto 4px}
.badge b{display:block;font-size:15px}
@media(max-width:600px){.skillrow{grid-template-columns:minmax(0,1fr) auto}.skillrow .acc-wrap{grid-column:1/-1;order:3}}
/* modal / toast / fx */
.modal{position:fixed;inset:0;background:rgba(22,20,26,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal .panel{max-width:520px;width:100%;margin:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast div{background:var(--ink);color:var(--yel);border:3px solid var(--yel);border-radius:12px;padding:8px 16px;font-weight:900;animation:pop .35s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.pow{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-8deg);font-family:"Bangers",Impact,sans-serif;font-size:clamp(48px,10vw,96px);color:var(--yel);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--red);animation:powin .9s ease-out forwards;white-space:nowrap}
.pt{position:absolute;width:14px;height:14px;border:2px solid var(--ink);animation:fly 1.1s ease-out forwards}
.pt.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border:0;width:22px;height:22px}
.bolt-fx{position:absolute;width:40px;height:120px;background:var(--yel);clip-path:polygon(40% 0,100% 0,60% 40%,95% 40%,20% 100%,40% 55%,5% 55%);animation:zap .7s steps(3) forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes powin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-8deg);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:0}}
@keyframes fly{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes zap{0%,100%{opacity:0}30%,70%{opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flex{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes strut{0%{transform:translateX(-140%)}100%{transform:translateX(0)}}
@keyframes sweep{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes crowd{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.do-bounce{animation:bounce .6s ease}.do-shake{animation:shake .4s ease}.do-spin{animation:spin .8s ease}.do-flex{animation:flex .5s ease 2}
.spot{transform-origin:50% 0;animation:sweep 3s ease-in-out infinite}
.crowdrow{animation:crowd .5s ease-in-out infinite}
.entrance{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#3a2a6b,#0d0b1c);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:12px}
.entrance .name{font-family:"Bangers",Impact,sans-serif;font-size:clamp(36px,7vw,64px);color:var(--yel);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--red)}
.entrance .walker{width:clamp(80px,14vw,120px);animation:strut 1.6s ease-out}
.entrance .btn{margin-top:8px}
/* reduced motion */
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
body.rm .pt,body.rm .bolt-fx{display:none}
body.rm .pow{animation:none!important;opacity:1}
@media print{body{background:#fff}}
.logo{white-space:nowrap}
@media(max-width:600px){.logo{font-size:19px;padding:3px 10px 1px}.topbar{gap:8px}.topbar .btn.sm{padding:4px 10px;font-size:14px}.chip{font-size:13px;padding:3px 9px}.toast div{font-size:14px;padding:5px 12px}.stage .hud .meter{display:none}}
</style>
</head>
<body>
<div id="app">
<header class="topbar" id="topbar"></header>
<main id="screen" aria-live="off"></main>
<noscript><p class="panel">Hero League Academy needs JavaScript turned on to play.</p></noscript>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<script>/* ===== Hero League Academy: curated content ===== */
var HLA_DATA = (function () {

/* ---------- fx ---------- */
const fx = $("#fx");
function pow(text) { const d = document.createElement("div"); d.className = "pow"; d.textContent = text; fx.appendChild(d); setTimeout(() => d.remove(), 950); }
function particles(kind) {
  if (document.body.classList.contains("rm")) return;
  const cols = ["#e63946", "#ffd23f", "#2ec4f1", "#1fa35c", "#ff5fa2", "#ff8a1f"];
  const W = innerWidth, Hh = innerHeight;
  const spawn = (x, y, n, cls, spread) => {
    for (let i = 0; i < n; i++) {
      const p = document.createElement("i"); p.className = "pt " + (cls || "");
      const a = Math.random() * Math.PI * 2, dist = (spread || 220) * (.4 + Math.random() * .6);
      p.style.left = x + "px"; p.style.top = y + "px"; p.style.background = cols[i % cols.length];
      p.style.setProperty("--dx", Math.cos(a) * dist + "px"); p.style.setProperty("--dy", (Math.sin(a) * dist + (cls === "conf" ? 260 : 0)) + "px");
      fx.appendChild(p); setTimeout(() => p.remove(), 1200);
    }
  };
  if (kind === "confetti") { for (let k = 0; k < 5; k++) spawn(W * (.1 + k * .2), Hh * .2, 12, "conf", 180); }
  else if (kind === "fireworks") { [[.25, .3], [.75, .28], [.5, .18]].forEach(([x, y], k) => setTimeout(() => spawn(W * x, Hh * y, 22, "star", 160), k * 250)); }
  else if (kind === "lightning") { for (let k = 0; k < 4; k++) { const b = document.createElement("i"); b.className = "bolt-fx"; b.style.left = (W * (.15 + k * .22)) + "px"; b.style.top = (Hh * .15) + "px"; fx.appendChild(b); setTimeout(() => b.remove(), 800); } spawn(W / 2, Hh * .4, 10, "star", 200); }
  else spawn(W / 2, Hh * .4, 18, "star", 260);
}
function celebrate(big) {
  const words = ["POW!", "BOOM!", "WHAM!", "ZING!", "KAPOW!", "YES!", "SLAM!"];

  if (hs && !document.body.classList.contains("rm")) { const cls = c === "spin" ? "do-spin" : c === "lightning" ? "do-flex" : "do-bounce"; hs.classList.remove("do-spin", "do-flex", "do-bounce"); void hs.getBBox; requestAnimationFrame(() => hs.classList.add(cls)); setTimeout(() => hs.classList.remove(cls), 1100); }
}

/* ---------- modal ---------- */
function modal(html, onMount) {
  const m = $("#modal"); m.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false;
  const prev = document.activeElement;
  const close = () => { m.hidden = true; m.innerHTML = ""; if (prev && prev.focus) try { prev.focus(); } catch (e) {} };
  m.onkeydown = e => { if (e.key === "Escape") close(); };
  if (onMount) onMount(m, close);
  const f = m.querySelector("[data-autofocus]") || m.querySelector("button"); if (f) f.focus();
  return close;
}
function confirmBox(title, text, yes, no, onYes) {
  modal(`<h2>${title}</h2><p>${text}</p><div class="row"><button class="btn red" id="m-yes">${yes}</button><button class="btn" id="m-no" data-autofocus>${no}</button></div>`, (m, close) => {
    $("#m-yes", m).onclick = () => { close(); onYes(); };
    $("#m-no", m).onclick = close;
  });
}

/* ---------- round engine ---------- */
const BASE_LEN = { rooftop: 6, main: 6, soccer: 6, court: 7 };
const GADGETS = ["Grapple Line", "Jet Boots", "Sonic Scanner", "Shield Bubble", "Glide Wings", "Rescue Net"];
const CLIMB = [[190, 170], [250, 150], [320, 120], [370, 95], [420, 70], [470, 45], [500, 20]];
function startRound(arena, mode) {
  R = { arena, mode, slots: H.planRound(arena, mode), ptr: 0, count: 0, results: [], used: {}, queue: [], q: null, attempt: 0, xp: 0, over: false, review: [], hintOpen: false, st: {}, theme: H.ARENAS[arena].theme };
  const st = R.st;
  if (arena === "rooftop") st.stage = 0;
  if (arena === "main") Object.assign(st, { fall: 1, me: 0, rv: 0, fMe: 0, fRv: 0, crowd: 10, decided: false, winner: null });
  if (arena === "soccer") Object.assign(st, { goals: 0, shots: 0, saves: 0 });
  if (arena === "court") Object.assign(st, { home: 84, away: 86, q: 4, clock: 150, finalDone: false, finalWon: false });
  go("round");
}
function quitRound(dest) {
  confirmBox("Leave this round?", "Your answers so far still count toward your progress, but you won't get the round's XP bonus.", "Leave round", "Keep playing", () => { R.over = true; go(dest || "hub"); });
}
function roundLen() { return BASE_LEN[R.arena]; }
function isDone() {
  const st = R.st;
  if (R.arena === "main") return (st.decided && R.count >= 6) || R.count >= 8;
  if (R.arena === "court") return st.finalDone;
  return (R.count >= roundLen() && !R.queue.length) || R.count >= 8;
}
function tierFor(subject) { return subject === "spell" ? S.settings.spellTier : S.settings.mathTier; }
function nextSlot() {
  // court final possession
  if (R.arena === "court" && ((R.count >= roundLen() - 1 && !R.queue.length) || R.count >= 7)) return { final: true, subject: R.mode === "spell" ? "spell" : "math", skill: R.mode === "spell" ? "dictation" : "word" };
  const s = R.slots[R.ptr % R.slots.length]; R.ptr++;
  const qi = R.queue.findIndex(x => x.subject === s.subject && x.due <= R.count);
  const qi2 = qi >= 0 ? qi : (R.count >= roundLen() - 1 || R.ptr > 7 ? R.queue.findIndex(x => x.due <= R.count + 1) : -1);
  if (qi2 >= 0) { const it = R.queue.splice(qi2, 1)[0]; return { subject: it.subject, skill: it.skill, tier: it.tier, similar: true }; }

/* ---------- training gym: word vault ---------- */
function renderVault() {

  const SYM = { correct: "✓", present: "↔", absent: "✕" }, LBL = { correct: "right spot", present: "in the word, wrong spot", absent: "not in the word" };

  <div class="wd" id="v-grid"></div><p id="v-msg" aria-live="polite" style="text-align:center;font-weight:900;min-height:1.5em"></p><div class="kb" id="v-kb"></div><div class="row c" id="v-after" style="margin-top:12px"></div></section>`;
  $("#v-back").onclick = () => go("hub");
  const KB = ["qwertyuiop", "asdfghjkl", "+zxcvbnm-"];
  const draw = () => {
    let h = "";
    for (let r = 0; r < 6; r++) {
      const row = rows[r], g = row ? row.g : r === rows.length ? cur : "";
      h += `<div class="wr" role="row">` + Array.from({ length: 5 }, (_, i) => { const st = row ? row.s[i] : ""; const ch = g[i] || ""; return `<div class="wc ${st}" role="gridcell" aria-label="${ch ? ch.toUpperCase() + (st ? ", " + LBL[st] : "") : "empty"}">${ch}${st ? `<small aria-hidden="true">${SYM[st]}</small>` : ""}</div>`; }).join("") + `</div>`;
    }

    $("#v-kb").innerHTML = KB.map(r => `<div class="kr">${r.split("").map(k => k === "+" ? `<button class="key wide" data-k="Enter">Enter</button>` : k === "-" ? `<button class="key wide" data-k="Backspace">Delete</button>` : `<button class="key ${keys[k] || ""}" data-k="${k}" aria-label="${k}${keys[k] ? ", " + LBL[keys[k]] : ""}">${k.toUpperCase()}</button>`).join("")}</div>`).join("");

  $("#hh-hint").onclick = () => q._flash();
  $("#hh-new").onclick = () => go("hunt"); $("#hh-back").onclick = () => go("hub");
  $("#ws [data-r]").focus();
}

/* ---------- progress ---------- */
function renderProgress() {
  const row = k => {
    const s = S.stats[k] || H.newSkillStat(), acc = s.attempts ? Math.round(s.correct / s.attempts * 100) : 0, first = s.attempts ? Math.round(s.firstTry / s.attempts * 100) : 0;
    return `<div class="skillrow"><div><b>${H.SKILLS[k].name}</b><div class="muted" style="font-size:14px">${s.attempts ? `${s.attempts} practiced · ${first}% first try` : "Not practiced yet"}</div></div>
    <div class="acc-wrap"><div class="acc" role="img" aria-label="${acc}% correct"><i style="width:${acc}%"></i></div><div class="muted" style="font-size:13px">${acc}% correct (including retries)</div></div>
    <div>${s.mastered ? `<span class="tag m">Mastered</span>` : s.attempts ? `<span class="tag">Best streak ${s.best}</span>` : ""}</div></div>`;
  };
  const spell = Object.keys(H.SKILLS).filter(k => H.SKILLS[k].subject === "spell"), math = Object.keys(H.SKILLS).filter(k => H.SKILLS[k].subject === "math");
  const tot = list => list.reduce((a, k) => { const s = S.stats[k]; if (s) { a.n += s.attempts; a.c += s.correct; } return a; }, { n: 0, c: 0 });
  const ts = tot(spell), tm = tot(math);
  const names = { rooftop: "Rooftop Rescue", main: "Main Event", soccer: "Soccer Shootout", court: "Clutch Court" };
  screen.innerHTML = `<section class="panel"><h2>${esc(S.hero.name || "Hero")}'s Progress</h2>
   <div class="row" style="margin-top:10px"><span class="chip">Level <b>${H.level(S.xp)}</b></span><span class="chip"><b>${S.xp}</b> XP</span><span class="chip">Rounds <b>${S.rounds}</b></span><span class="chip">Badges <b>${S.badges.length}</b></span>
   <span class="chip">Spelling level: <b>${S.settings.spellTier === "challenge" ? "Challenge" : "Standard"}</b></span><span class="chip">Math level: <b>${S.settings.mathTier === "challenge" ? "Challenge" : "Standard"}</b></span></div></section>
   <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">
   <section class="panel"><span class="caption">Spelling</span><p class="muted" style="margin-top:6px">${ts.n ? `${ts.n} words practiced · ${Math.round(ts.c / ts.n * 100)}% correct` : "No spelling practice yet."}</p>${spell.map(row).join("")}</section>
   <section class="panel"><span class="caption">Math</span><p class="muted" style="margin-top:6px">${tm.n ? `${tm.n} problems practiced · ${Math.round(tm.c / tm.n * 100)}% correct` : "No math practice yet."}</p>${math.map(row).join("")}</section></div>
   <section class="panel"><span class="caption">Badges</span><div class="badges" style="margin-top:10px">${Object.keys(H.BADGES).map(id => { const b = H.BADGES[id], got = S.badges.indexOf(id) >= 0; return `<div class="badge ${got ? "" : "locked"}">${badgeIcon(!got)}<b>${esc(b.name)}</b>${esc(b.desc)}${got ? "" : '<span class="sr"> (not earned yet)</span>'}</div>`; }).join("")}</div></section>
   <section class="panel"><span class="caption">Recent rounds</span><div style="margin-top:8px">${S.log.length ? `<ul>${S.log.slice(0, 10).map(l => `<li>${new Date(l.t).toLocaleDateString()} — ${names[l.arena]} (${{ spell: "Spelling", math: "Math", mixed: "Mixed" }[l.mode]}): ${l.first} first try, ${l.second} on retry, of ${l.n}${l.win ? " · WIN" : ""} · +${l.xp} XP</li>`).join("")}</ul>` : "<p>No rounds yet. Go play one!</p>"}</div></section>
   <div class="row"><button class="btn red" id="p-back">Back to arenas</button></div>`;
  $("#p-back").onclick = () => go(S.hero.name ? "hub" : "title");
}

/* ---------- locker ---------- */
function renderLocker() {
  const kinds = { cape: "Capes", mask: "Masks", emblem: "Emblems", gloves: "Gloves", boots: "Boots", banner: "Arena banners", celebration: "Celebrations" };
  const equipKey = { "cape-storm": ["hero", "cape", "storm"], "cape-royal": ["hero", "cape", "royal"], "mask-visor": ["hero", "mask", "visor"], "mask-helm": ["hero", "mask", "helm"], "emblem-flame": ["hero", "emblem", "flame"], "emblem-crown": ["hero", "emblem", "crown"], "gloves-power": ["hero", "gloves", "power"], "boots-rocket": ["hero", "boots", "rocket"], "banner-bolt": ["settings", "banner", "bolt"], "banner-stars": ["settings", "banner", "stars"], "banner-checker": ["settings", "banner", "checker"], "banner-galaxy": ["settings", "banner", "galaxy"], "celeb-confetti": ["settings", "celebration", "confetti"], "celeb-lightning": ["settings", "celebration", "lightning"], "celeb-fireworks": ["settings", "celebration", "fireworks"], "celeb-spin": ["settings", "celebration", "spin"] };
  const isOn = id => { const [o, k, v] = equipKey[id]; return S[o][k] === v; };
  screen.innerHTML = `<section class="panel"><h2>Hero Locker</h2><p>Earn XP to unlock new gear. You have <b>${S.xp} XP</b>.</p>
   <div class="grid2" style="grid-template-columns:minmax(0,220px) minmax(0,1fr)"><div class="herobox" id="lk-prev">${heroSVG(S.hero, "flex")}</div>
   <div>${Object.keys(kinds).map(k => `<h3 style="margin:10px 0 6px">${kinds[k]}</h3><div class="row">${H.UNLOCKS.filter(u => u.kind === k).map(u => { const got = has(u.id), on = got && isOn(u.id); return `<button class="choice" data-u="${u.id}" ${got ? "" : "disabled"} aria-pressed="${on}">${esc(u.name)} ${got ? (on ? "· equipped" : "· equip") : `· ${u.xp} XP`}</button>`; }).join("")}${k === "banner" ? `<button class="choice" data-off="banner" aria-pressed="${S.settings.banner === "none"}">No banner</button>` : ""}${k === "celebration" ? `<button class="choice" data-off="celebration" aria-pressed="${S.settings.celebration === "starburst"}">Star Burst (starter)</button><button class="btn sm" id="lk-try">Preview celebration</button>` : ""}</div>`).join("")}
   <div class="banner ${S.settings.banner}" style="margin-top:14px"></div></div></div></section><div class="row"><button class="btn red" id="lk-back">Back to arenas</button><button class="btn" id="lk-edit">Open Hero Lab</button></div>`;
  $$("[data-u]").forEach(b => b.onclick = () => { const [o, k, v] = equipKey[b.dataset.u]; const def = { cape: "classic", mask: "domino", emblem: "bolt", gloves: "basic", boots: "basic", banner: "none", celebration: "starburst" }; S[o][k] = S[o][k] === v ? def[k] : v; persist(); sfx.tap(); renderLocker(); });
  $$("[data-off]").forEach(b => b.onclick = () => { S.settings[b.dataset.off] = b.dataset.off === "banner" ? "none" : "starburst"; persist(); renderLocker(); });
  $("#lk-try").onclick = () => celebrate(); $("#lk-back").onclick = () => go("hub"); $("#lk-edit").onclick = () => go("creator");
}

/* ---------- settings ---------- */
function renderSettings() {
  const sw = (id, label, on, desc) => `<div class="skillrow" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${label}</b><div class="muted" style="font-size:14px">${desc}</div></div><button class="btn sm ${on ? "on" : ""}" id="${id}" aria-pressed="${on}">${on ? "On" : "Off"}</button></div>`;
  const rmOn = document.body.classList.contains("rm");
  screen.innerHTML = `<section class="panel"><h2>Settings</h2>
   ${sw("s-mute", "Mute sounds", S.settings.mute, "Turns off sound effects. Hear the word still works when you tap it.")}
   ${sw("s-rm", "Reduced motion", rmOn, "Stops bouncing, flying, and flashing effects.")}
   ${sw("s-timer", "Speed bonus timer", S.settings.timer, "Optional countdown for bonus XP. Running out never costs points.")}
   ${sw("s-speech", "Hear the word button", S.settings.speech, speechOK ? "Reads spelling words aloud using this browser's voice." : "This browser can't read words aloud, so written clues are used instead.")}
   <div class="skillrow" style="grid-template-columns:minmax(0,1fr) auto"><div><b>Spelling level</b><div class="muted" style="font-size:14px">Standard or Challenge words.</div></div><div class="seg">${["standard", "challenge"].map(t => `<button data-k="spellTier" data-v="${t}" aria-pressed="${S.settings.spellTier === t}">${t === "standard" ? "Standard" : "Challenge"}</button>`).join("")}</div></div>
   <div class="skillrow" style="grid-template-columns:minmax(0,1fr) auto"><div><b>Math level</b><div class="muted" style="font-size:14px">Standard (3rd–4th grade) or Challenge.</div></div><div class="seg">${["standard", "challenge"].map(t => `<button data-k="mathTier" data-v="${t}" aria-pressed="${S.settings.mathTier === t}">${t === "standard" ? "Standard" : "Challenge"}</button>`).join("")}</div></div>
   </section><section class="panel"><span class="caption">Saved game</span><p style="margin-top:8px">${storageOK ? "Progress, unlocked items, and settings save automatically on this device and browser." : "This browser is blocking saves, so progress resets when the page closes."}</p>
   <button class="btn red" id="s-new">New Game (erase saved progress)</button></section><div class="row"><button class="btn" id="s-back">Back</button></div>`;
  $("#s-mute").onclick = () => { S.settings.mute = !S.settings.mute; persist(); renderSettings(); topbar(); };
  $("#s-rm").onclick = () => { S.settings.reducedMotion = !rmOn; persist(); applySettings(); renderSettings(); };
  $("#s-timer").onclick = () => { S.settings.timer = !S.settings.timer; persist(); renderSettings(); };
  $("#s-speech").onclick = () => { S.settings.speech = !S.settings.speech; persist(); renderSettings(); };
  $$("[data-k]").forEach(b => b.onclick = () => { S.settings[b.dataset.k] = b.dataset.v; persist(); renderSettings(); });
  $("#s-new").onclick = newGameFlow; $("#s-back").onclick = () => go(S.hero.name ? "hub" : "title");
}

/* ---------- boot ---------- */
applySettings();
go("title");
window.__HLA = { get S() { return S; }, get R() { return R; }, go, startRound, persist };
}
</script>
</body>
</html>
